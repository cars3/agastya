[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agastya-rag-mcp"
version = "0.1.0"
description = "PDF retrieval and typed decisions for MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.9", "numpy", "pymupdf", "torch", "sentence-transformers",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
decision = ["fastapi", "uvicorn", "pydantic>=2", "python-dotenv", "typesafe-sdk"]

[project.scripts]
agastya = "main:cli"

[tool.setuptools]
py-modules = ["main", "split_pdf", "gemma", "decision_model"]
